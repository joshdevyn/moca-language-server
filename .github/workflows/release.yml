name: Build and Release MOCA GUI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.12.25)'
        required: true
        default: 'v1.12.25'

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Build with Maven
      run: mvn clean package -DskipTests
      
    - name: Get version from pom.xml
      id: get_version
      run: |
        $version = (Select-Xml -Path "pom.xml" -XPath "//project/version").Node.InnerText
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "Project version: $version"
      shell: powershell
      
    - name: Create release tag (if workflow_dispatch)
      if: github.event_name == 'workflow_dispatch'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git tag -a ${{ github.event.inputs.version }} -m "Release ${{ github.event.inputs.version }}"
        git push origin ${{ github.event.inputs.version }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Verify build artifacts
      run: |
        echo "Checking build artifacts..."
        if (Test-Path "target\MOCA-GUI.exe") {
          echo "✓ MOCA-GUI.exe created successfully"
          $size = (Get-Item "target\MOCA-GUI.exe").Length / 1MB
          echo "Size: $([math]::Round($size, 2)) MB"
        } else {
          echo "✗ MOCA-GUI.exe not found!"
          exit 1
        }
        
        if (Test-Path "target\moca-gui.jar") {
          echo "✓ moca-gui.jar created successfully"
          $size = (Get-Item "target\moca-gui.jar").Length / 1MB
          echo "Size: $([math]::Round($size, 2)) MB"
        } else {
          echo "✗ moca-gui.jar not found!"
          exit 1
        }
      shell: powershell
      
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.event.inputs.version || github.ref_name }}
        release_name: MOCA GUI ${{ github.event.inputs.version || github.ref_name }}
        body: |
          ## MOCA GUI Release ${{ github.event.inputs.version || github.ref_name }}
          
          ### What's New
          - Enterprise-grade MOCA development environment
          - Advanced connection management with profiles
          - Multi-command execution with tabbed results
          - Professional script editor with syntax highlighting
          - Data export (Excel, CSV, JSON, XML)
          - Performance monitoring and visualization
          - Comprehensive keyboard shortcuts
          
          ### Download Options
          - **Windows Executable**: `MOCA-GUI.exe` - Ready to run, no Java installation required
          - **Cross-platform JAR**: `moca-gui.jar` - Requires Java 17+ (`java -jar moca-gui.jar`)
          
          ### System Requirements
          - **For .exe**: Windows 10/11 (Java 17+ will be downloaded automatically if needed)
          - **For .jar**: Java 17+ on any platform (Windows, macOS, Linux)
          
          ### Quick Start
          1. Download `MOCA-GUI.exe`
          2. Run the executable
          3. Go to Connections tab to set up your MOCA server connection
          4. Switch to Command & Script tab to start developing
          
          Built with ❤️ for MOCA developers
        draft: false
        prerelease: false
        
    - name: Upload Windows Executable
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: target/MOCA-GUI.exe
        asset_name: MOCA-GUI.exe
        asset_content_type: application/octet-stream
        
    - name: Upload JAR file
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: target/moca-gui.jar
        asset_name: moca-gui.jar
        asset_content_type: application/java-archive
        
    - name: Upload checksums
      run: |
        # Create checksums file
        $checksums = @()
        
        if (Test-Path "target\MOCA-GUI.exe") {
          $hash = Get-FileHash "target\MOCA-GUI.exe" -Algorithm SHA256
          $checksums += "$($hash.Hash.ToLower())  MOCA-GUI.exe"
        }
        
        if (Test-Path "target\moca-gui.jar") {
          $hash = Get-FileHash "target\moca-gui.jar" -Algorithm SHA256
          $checksums += "$($hash.Hash.ToLower())  moca-gui.jar"
        }
        
        $checksums | Out-File -FilePath "checksums.txt" -Encoding utf8
        echo "Created checksums.txt:"
        Get-Content "checksums.txt"
      shell: powershell
      
    - name: Upload Checksums
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: checksums.txt
        asset_name: checksums.txt
        asset_content_type: text/plain
